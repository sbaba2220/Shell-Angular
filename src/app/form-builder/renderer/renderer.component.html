<form [formGroup]="form" (ngSubmit)="submit()" class="p-3 border rounded">
  <div *ngFor="let field of fields" class="mb-3">
    <label class="form-label">{{ field.label }}</label>

    <input *ngIf="field.type === 'text'" type="text" class="form-control" [formControlName]="field.name" />
    <input *ngIf="field.type === 'number'" type="number" class="form-control" [formControlName]="field.name" />
    <select *ngIf="field.type === 'select'" class="form-select" [formControlName]="field.name">
      <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
    </select>
    <div *ngIf="field.type === 'checkbox'" class="form-check">
      <input type="checkbox" class="form-check-input" [formControlName]="field.name" />
    </div>
  </div>

  <button class="btn btn-primary">Submit</button>
</form>
